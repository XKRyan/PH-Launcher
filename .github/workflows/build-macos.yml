name: Build macOS test package

on:
  workflow_dispatch:

jobs:
  build-universal:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build unsigned Universal package
        run: npm run dist:mac
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PH-Launcher-macOS-unsigned-test
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

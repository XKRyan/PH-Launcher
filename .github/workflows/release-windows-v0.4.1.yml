name: Publish Windows v0.4.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/releases/v0.4.1.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-v0.4.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'XKRyan/PH-Launcher'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate release source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          if ($package.version -ne '0.4.1') { throw "Expected package version 0.4.1, got $($package.version)" }
          if (Test-Path -LiteralPath 'assets\dictionary\ecdict.db') {
            throw 'ecdict.db must not be present in Git history.'
          }

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build pinned ECDICT database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = 'bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b'
          New-Item -ItemType Directory -Force -Path '.cache\ECDICT-meta' | Out-Null
          git -C '.cache\ECDICT-meta' init
          git -C '.cache\ECDICT-meta' remote add origin 'https://github.com/skywind3000/ECDICT.git'
          git -C '.cache\ECDICT-meta' fetch --depth 1 origin $sourceCommit
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the pinned ECDICT commit.' }
          git -C '.cache\ECDICT-meta' checkout --detach FETCH_HEAD
          $actualCommit = (git -C '.cache\ECDICT-meta' rev-parse HEAD).Trim()
          if ($actualCommit -ne $sourceCommit) { throw "ECDICT commit mismatch: $actualCommit" }
          npm run dictionary
          if (-not (Test-Path -LiteralPath 'assets\dictionary\ecdict.db')) { throw 'Dictionary build did not create ecdict.db.' }

      - name: Run automated checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          npm run self-test
          if ($LASTEXITCODE -ne 0) { throw 'Application self-test failed.' }

      - name: Build Windows packages
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed.' }
          npm run dist:installer -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }

      - name: Assemble release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'release\PH-Launcher-0.4.1-x64.exe'
          $portable = 'release\PH-Launcher-0.4.1-Portable.exe'
          foreach ($file in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release file: $file" }
            if ((Get-Item -LiteralPath $file).Length -lt 100MB) { throw "Release file is unexpectedly small: $file" }
          }

          git archive --format=zip --output='release\PH-Launcher-0.4.1-Source.zip' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create source archive.' }
          Copy-Item -LiteralPath 'docs\使用指南.md' -Destination 'release\PH-Launcher-使用指南.md'
          Copy-Item -LiteralPath 'docs\PH-Launcher-0.4.1-发布与安全说明.md' -Destination 'release\PH-Launcher-0.4.1-发布与安全说明.md'
          Copy-Item -LiteralPath 'docs\images\overview.png' -Destination 'release\PH-Launcher-界面预览.png'

          $hashedAssets = @(
            $installer,
            $portable,
            'release\PH-Launcher-0.4.1-Source.zip',
            'release\PH-Launcher-使用指南.md',
            'release\PH-Launcher-0.4.1-发布与安全说明.md',
            'release\PH-Launcher-界面预览.png'
          )
          $lines = foreach ($asset in $hashedAssets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'release\PH-Launcher-0.4.1-SHA256.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'XKRyan/PH-Launcher'
          $tag = 'v0.4.1'
          gh release view $tag --repo $repo *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $tagCommit = (gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha').Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Unable to verify the existing release tag.' }
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Refusing to retarget immutable $tag from $tagCommit to $env:GITHUB_SHA"
            }
            gh release edit $tag --repo $repo --title 'PH Launcher v0.4.1 — Windows' --notes-file 'docs\PH-Launcher-0.4.1-发布与安全说明.md'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to update release metadata.' }
          } else {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title 'PH Launcher v0.4.1 — Windows' --notes-file 'docs\PH-Launcher-0.4.1-发布与安全说明.md'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create GitHub Release.' }
          }

          $uploadAssets = @(
            'release\PH-Launcher-0.4.1-x64.exe',
            'release\PH-Launcher-0.4.1-Portable.exe',
            'release\PH-Launcher-0.4.1-Source.zip',
            'release\PH-Launcher-0.4.1-SHA256.txt',
            'release\PH-Launcher-使用指南.md',
            'release\PH-Launcher-0.4.1-发布与安全说明.md',
            'release\PH-Launcher-界面预览.png'
          )
          gh release upload $tag @uploadAssets --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload one or more release assets.' }

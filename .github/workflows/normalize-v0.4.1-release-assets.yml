name: Normalize v0.4.1 release asset names

on:
  push:
    branches:
      - main
    paths:
      - ".github/releases/v0.4.1.asset-names.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-v0.4.1-release-assets
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'XKRyan/PH-Launcher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Normalize names and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          repo='XKRyan/PH-Launcher'
          tag='v0.4.1'
          expected_tag_commit='2b36823c91b1a800214b40d2596612aa487a98c8'

          actual_tag_commit="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
          if [[ "$actual_tag_commit" != "$expected_tag_commit" ]]; then
            echo "Refusing to edit assets for unexpected tag commit: $actual_tag_commit" >&2
            exit 1
          fi

          release_json="$(gh api "repos/$repo/releases/tags/$tag")"

          rename_asset() {
            local old_name="$1"
            local new_name="$2"
            local label="$3"
            local old_id new_id
            old_id="$(jq -r --arg name "$old_name" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
            new_id="$(jq -r --arg name "$new_name" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"

            if [[ -n "$new_id" ]]; then
              return 0
            fi
            if [[ -z "$old_id" ]]; then
              echo "Missing release asset: $old_name" >&2
              exit 1
            fi

            gh api --method PATCH "repos/$repo/releases/assets/$old_id" \
              -f name="$new_name" \
              -f label="$label" >/dev/null
            release_json="$(gh api "repos/$repo/releases/tags/$tag")"
          }

          rename_asset 'PH-Launcher-.md' 'PH-Launcher-User-Guide-zh-CN.md' 'PH Launcher 使用指南'
          rename_asset 'PH-Launcher-0.4.1-.md' 'PH-Launcher-0.4.1-Release-and-Security-Notes-zh-CN.md' 'v0.4.1 发布与安全说明'
          rename_asset 'PH-Launcher-.png' 'PH-Launcher-UI-Preview.png' 'PH Launcher 界面预览'

          release_json="$(gh api "repos/$repo/releases/tags/$tag")"
          manifest='PH-Launcher-0.4.1-SHA256.txt'
          asset_names=(
            'PH-Launcher-0.4.1-x64.exe'
            'PH-Launcher-0.4.1-Portable.exe'
            'PH-Launcher-0.4.1-Source.zip'
            'PH-Launcher-User-Guide-zh-CN.md'
            'PH-Launcher-0.4.1-Release-and-Security-Notes-zh-CN.md'
            'PH-Launcher-UI-Preview.png'
          )

          : > "$manifest"
          for asset_name in "${asset_names[@]}"; do
            digest="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            if [[ "$digest" != sha256:* ]]; then
              echo "Missing SHA-256 digest for $asset_name" >&2
              exit 1
            fi
            printf '%s  %s\n' "${digest#sha256:}" "$asset_name" >> "$manifest"
          done

          gh release upload "$tag" "$manifest" --repo "$repo" --clobber

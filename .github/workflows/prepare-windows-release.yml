name: Publish Windows 0.5.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/releases/v0.5.1-retry-1.trigger"

permissions:
  contents: read

concurrency:
  group: windows-v0.5.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.5.1
  RELEASE_VERSION: 0.5.1
  MARKER_PATH: .github/releases/v0.5.1-retry-1.trigger

jobs:
  build:
    if: github.repository == 'XKRyan/PH-Launcher'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify fixed release intent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'PH_LAUNCHER_WINDOWS_RELEASE_RETRY'
            'tag=v0.5.1'
            'version=0.5.1'
            'attempt=2'
            'publish-release=true'
            ''
          ) -join "`n"
          $actual = [IO.File]::ReadAllText((Join-Path $PWD $env:MARKER_PATH)).Replace("`r`n", "`n")
          if ($actual -ne $expected) { throw 'The Windows release marker does not match the reviewed fixed payload.' }
          $actualVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($actualVersion -ne $env:RELEASE_VERSION) { throw "Expected $env:RELEASE_VERSION, found $actualVersion." }
          if (Test-Path -LiteralPath 'assets\dictionary\ecdict.db') {
            throw 'ecdict.db must be generated during the workflow, not committed to Git.'
          }

      - name: Fail if tag or release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $responseFile = Join-Path $env:RUNNER_TEMP 'github-response.json'
          foreach ($endpoint in @("git/ref/tags/$env:RELEASE_TAG", "releases/tags/$env:RELEASE_TAG")) {
            $status = & curl.exe --silent --show-error --output $responseFile --write-out '%{http_code}' `
              --header 'Accept: application/vnd.github+json' `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --header 'X-GitHub-Api-Version: 2022-11-28' `
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/$endpoint"
            if ($LASTEXITCODE -ne 0) { throw "Unable to prove that $endpoint is absent." }
            if ($status -eq '200') { throw "$endpoint already exists; refusing to overwrite it." }
            if ($status -ne '404') { throw "Unable to prove that $endpoint is absent (GitHub HTTP $status)." }
          }

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Prepare pinned offline dictionary
        run: npm run dictionary:prepare

      - name: Run automated checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          npm run self-test
          if ($LASTEXITCODE -ne 0) { throw 'Application self-test failed.' }

      - name: Build Windows packages
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed.' }
          npm run dist:installer -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }

      - name: Assemble release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "release\PH-Launcher-$env:RELEASE_VERSION-x64.exe"
          $portable = "release\PH-Launcher-$env:RELEASE_VERSION-Portable.exe"
          foreach ($file in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release file: $file" }
            if ((Get-Item -LiteralPath $file).Length -lt 100MB) { throw "Release file is unexpectedly small: $file" }
          }

          $source = "release\PH-Launcher-$env:RELEASE_VERSION-Source.zip"
          git archive --format=zip --output=$source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create source archive.' }
          Copy-Item -LiteralPath 'docs\使用指南.md' -Destination 'release\PH-Launcher-使用指南.md'
          Copy-Item -LiteralPath "docs\PH-Launcher-$env:RELEASE_VERSION-发布与安全说明.md" -Destination "release\PH-Launcher-$env:RELEASE_VERSION-发布与安全说明.md"

          $assets = @(
            $installer,
            $portable,
            $source,
            'release\PH-Launcher-使用指南.md',
            "release\PH-Launcher-$env:RELEASE_VERSION-发布与安全说明.md"
          )
          $manifestPath = "release\PH-Launcher-$env:RELEASE_VERSION-SHA256.txt"
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD $manifestPath), $lines, [Text.UTF8Encoding]::new($false))

      - name: Upload reviewed Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PH-Launcher-0.5.1-Windows-x64
          path: |
            release/PH-Launcher-0.5.1-x64.exe
            release/PH-Launcher-0.5.1-Portable.exe
            release/PH-Launcher-0.5.1-Source.zip
            release/PH-Launcher-0.5.1-SHA256.txt
            release/PH-Launcher-使用指南.md
            release/PH-Launcher-0.5.1-发布与安全说明.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download reviewed Windows bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PH-Launcher-0.5.1-Windows-x64
          path: release

      - name: Verify and publish fixed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            "PH-Launcher-$env:RELEASE_VERSION-x64.exe",
            "PH-Launcher-$env:RELEASE_VERSION-Portable.exe",
            "PH-Launcher-$env:RELEASE_VERSION-Source.zip",
            "PH-Launcher-$env:RELEASE_VERSION-SHA256.txt",
            'PH-Launcher-使用指南.md',
            "PH-Launcher-$env:RELEASE_VERSION-发布与安全说明.md"
          )
          $actual = Get-ChildItem -LiteralPath release -File | Select-Object -ExpandProperty Name
          if (Compare-Object ($expected | Sort-Object) ($actual | Sort-Object)) { throw 'Unexpected Windows release bundle contents.' }

          $manifest = Get-Content -LiteralPath "release\PH-Launcher-$env:RELEASE_VERSION-SHA256.txt"
          foreach ($fileName in $expected | Where-Object { $_ -notlike '*SHA256.txt' }) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path release $fileName)).Hash.ToLowerInvariant()
            if ($manifest -notcontains "$hash  $fileName") { throw "Checksum mismatch for $fileName" }
          }

          $assets = Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "PH Launcher $env:RELEASE_TAG — Windows" `
            --notes-file "release\PH-Launcher-$env:RELEASE_VERSION-发布与安全说明.md"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create the fixed Windows release.' }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.prerelease -or $release.draft) { throw 'Windows release must be a published stable release.' }
          if ($release.assets.Count -ne 6) { throw 'Windows release asset count is incorrect.' }

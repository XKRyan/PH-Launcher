name: Build collaboration preview

on:
  pull_request:
    branches: [main]
    paths: ["electron/**", "src/**", "tests/**", "package*.json", "build/**", ".github/workflows/build-collaboration.yml"]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA at the selected branch or tag
        required: true
        type: string
      version:
        description: Expected package version
        required: true
        default: '2.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: collaboration-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reviewed-packages:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-v2.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}

  package:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PHL_LITE_DIR: ${{ github.workspace }}/.ci/phl-lite
    steps:
      - name: Preserve exact source bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned shared-account compatibility source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: huaziqian40-bot/Pinghe-Launcher-Lite
          ref: cd420f40a05dfae8b3482b851785ba4411d7b48d
          path: .ci/phl-lite
          persist-credentials: false
          sparse-checkout: ui/account-ui.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run dictionary:prepare
      - run: npm test
      - run: npm run self-test
        timeout-minutes: 3
      - name: Windows preview
        if: runner.os == 'Windows'
        # 只有一种发布形态：安装版（数据固定放在 exe 同级的 data/ 里，
        # 便携版会把程序解压到临时目录，数据就跟着跑偏了）。
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Unsigned universal macOS preview
        if: runner.os == 'macOS'
        # Ad-hoc identity only; no signing credentials or publishing token are supplied.
        # electron-builder otherwise skips even ad-hoc signing on pull requests.
        env:
          CSC_FOR_PULL_REQUEST: "true"
        run: npm run dist:mac:preview
      - name: macOS architecture and preview notes
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          zsh scripts/verify-mac-preview.sh
          node scripts/prepare-mac-preview-assets.cjs
      - name: Packaged macOS launch check
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: '"release/mac-universal/PH Launcher.app/Contents/MacOS/PH Launcher" --self-test'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: PH-Launcher-collaboration-${{ runner.os }}
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*UNSIGNED*.md
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: macOS DMG download
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PH-Launcher-macOS-DMG
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*UNSIGNED*.md
            release/SHA256SUMS.txt
      - name: macOS ZIP download
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PH-Launcher-macOS-ZIP
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            release/*.zip
            release/*UNSIGNED*.md
            release/SHA256SUMS.txt
